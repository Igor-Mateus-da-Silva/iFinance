<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="royalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#royalGrad)" />
  
  <!-- Anel sutil de borda interna -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4" />
  
  <!-- Gráfico de Crescimento / Finanças e Letra F estilizada -->
  <g filter="url(#shadow)" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Linha de tendência ascendente -->
    <path d="M 120 350 L 210 260 L 290 320 L 392 170" />
    <!-- Flecha indicadora de crescimento -->
    <path d="M 330 170 L 392 170 L 392 232" />
  </g>

  <!-- Ponto de destaque no topo -->
  <circle cx="392" cy="170" r="14" fill="#60A5FA" />
  
  <!-- Barra de base institucional -->
  <rect x="120" y="390" width="272" height="14" rx="7" fill="#93C5FD" fill-opacity="0.9" />
</svg>
